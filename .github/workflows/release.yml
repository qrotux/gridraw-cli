name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    # A tag push does not match the CI workflow's branch trigger, so the gate
    # runs here too: nothing is published from a commit that fails it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build and package
        run: |
          name="gridraw-${GITHUB_REF_NAME}-${GOOS}-${GOARCH}"
          bin="gridraw"
          if [ "$GOOS" = "windows" ]; then bin="gridraw.exe"; fi
          mkdir -p "dist/$name"
          # The tag is stamped in, so `gridraw --version` reports the release
          # rather than the commit it was built from.
          go build -trimpath \
            -ldflags "-s -w -X github.com/qrotux/gridraw-cli/internal/cli.version=${GITHUB_REF_NAME}" \
            -o "dist/$name/$bin" ./cmd/gridraw
          cp README.md LICENSE "dist/$name/"
          cd dist
          if [ "$GOOS" = "windows" ]; then
            zip -qr "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi
      - name: check the stamp took
        # -X against a wrong package path is a silent no-op, so the one leg that
        # can run here proves the tag actually reached the binary.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          got="$(./dist/gridraw-${GITHUB_REF_NAME}-linux-amd64/gridraw --version)"
          echo "$got"
          case "$got" in
            *"$GITHUB_REF_NAME") ;;
            *) echo "the version stamp did not take"; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    # One job owns the release, so five matrix legs cannot race to create it.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: package-*
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz ./*.zip > SHA256SUMS
          cat SHA256SUMS
      - name: release notes
        env:
          REPO: ${{ github.repository }}
        run: |
          base="https://github.com/$REPO/releases/download/$GITHUB_REF_NAME"
          {
            echo "## Downloads"
            echo
            echo "| platform | file |"
            echo "|---|---|"
            for f in dist/*.tar.gz dist/*.zip; do
              name="$(basename "$f")"
              # gridraw-v1.2.3-darwin-arm64.tar.gz -> darwin/arm64
              platform="$(echo "$name" | sed -E "s/^gridraw-.*-([a-z]+)-([a-z0-9]+)\.(tar\.gz|zip)$/\1\/\2/")"
              echo "| \`$platform\` | [$name]($base/$name) |"
            done
            echo
            echo "Verify a download against [SHA256SUMS]($base/SHA256SUMS):"
            echo
            echo '```sh'
            echo "curl -LO $base/SHA256SUMS"
            echo "sha256sum --ignore-missing -c SHA256SUMS"
            echo '```'
            echo
            echo "Or build from source: \`go install github.com/qrotux/gridraw-cli/cmd/gridraw@$GITHUB_REF_NAME\`"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md
      # Pinned by commit: this third-party action runs with contents: write, so
      # a moved tag must not be able to change what runs here. (v3.0.3)
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body_path: RELEASE_BODY.md
          generate_release_notes: true
