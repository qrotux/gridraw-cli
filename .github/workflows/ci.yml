name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    # The gate CLAUDE.md names, on the two platforms the tests are known to
    # pass on. Windows is covered by the build job below: the test suite makes
    # POSIX assumptions about paths and the home directory that have never been
    # checked there.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The version line falls back to the commit the build came from.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: build
        run: |
          out="gridraw"
          if [ "$GOOS" = "windows" ]; then out="gridraw.exe"; fi
          go build -trimpath -o "dist/$out" ./cmd/gridraw
      - uses: actions/upload-artifact@v4
        with:
          name: gridraw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
