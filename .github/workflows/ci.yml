name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # The gate CLAUDE.md names, on the two platforms the tests pass on. Windows
    # is covered by the build job below: two config tests assert a 0600 file
    # mode, which Windows cannot report.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: go mod tidy is clean
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  build:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: |
          out="gridraw"
          if [ "$GOOS" = "windows" ]; then out="gridraw.exe"; fi
          go build -trimpath -o "dist/$out" ./cmd/gridraw
      - name: report its version
        # Only the leg that matches the runner can be executed; it is enough to
        # prove the binary starts and knows what it is.
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: ./dist/gridraw --version
      - uses: actions/upload-artifact@v4
        with:
          name: gridraw-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
